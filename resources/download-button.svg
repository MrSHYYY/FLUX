<svg xmlns="http://www.w3.org/2000/svg" width="340" height="72" viewBox="0 0 340 72" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="340" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="340" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="60%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="16" y1="16" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ebecee"/>
    </linearGradient>
    <filter id="shadow" x="-4" y="-2" width="348" height="80" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .card-bg {
      transition: all 0.25s ease;
    }
    .card:hover .card-bg {
      fill: #1f1f23;
      stroke: #ffffff;
    }
    .card:hover .action-icon {
      stroke: #ffffff;
      transform: translate(306px, 29px);
    }
    .action-icon {
      transition: transform 0.2s ease, stroke 0.2s ease;
    }
  </style>

  <g class="card" cursor="pointer">
    <!-- Card Background -->
    <rect class="card-bg" x="2" y="2" width="336" height="68" rx="14" ry="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Left Icon Container (White Accent) -->
    <rect x="16" y="16" width="40" height="40" rx="10" ry="10" fill="url(#iconGrad)"/>
    <!-- Download Icon on White Container -->
    <g transform="translate(24, 24)" stroke="#101012" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12 3v11"/>
      <path d="m7 10 5 5 5-5"/>
      <path d="M4 19h16"/>
    </g>

    <!-- Typography -->
    <text x="68" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="-0.01em">
      Download setup
    </text>
    <text x="68" y="50" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400">
      Recommended · Windows installer
    </text>

    <!-- Right Download Key/Icon (replacing arrow) -->
    <g class="action-icon" transform="translate(306, 27)" stroke="#82828b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9 3v8"/>
      <path d="m5.5 7.5 3.5 3.5 3.5-3.5"/>
      <path d="M3 14.5h12"/>
    </g>
  </g>
</svg>
